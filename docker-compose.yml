version: '3.8'

services:
  # 1. База данных PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: pulse-db
    environment:
      POSTGRES_DB: sprint
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: qwer
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sprint"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Бэкенд (Spring Boot)
  backend:
    build:
      context: ./tms-backend
      dockerfile: Dockerfile
    container_name: pulse-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/sprint
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: qwer
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"
    volumes:
      - ./tms-backend/uploads:/app/uploads # Чтобы загруженные картинки не терялись при перезапуске
    restart: unless-stopped

  # 3. Фронтенд (React + Nginx)
  frontend:
    build:
      context: ./tms-frontend
      dockerfile: Dockerfile
    container_name: pulse-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  postgres_data: